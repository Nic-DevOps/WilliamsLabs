# Uptime Kuma — runs on the monitoring VM next to Prometheus/Grafana.
# Bound to localhost only: the admin dashboard is reached over Tailscale
# (`tailscale serve`), and only the public status page / badges are exposed
# through the Cloudflare Tunnel (see cloudflared-ingress.yml).
services:
  uptime-kuma:
    image: louislam/uptime-kuma:2
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./data:/app/data
    security_opt:
      - no-new-privileges:true
