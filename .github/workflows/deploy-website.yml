name: Deploy Website

on:
  push:
    branches: [main]
    paths:
      - "Website/html/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # SSH on the droplet only accepts connections arriving over Tailscale
      # (ufw allows port 22 on tailscale0 only, not the public interface),
      # so the runner joins the tailnet first and reaches DEPLOY_HOST via
      # its Tailscale IP instead of its public IP.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      # The deploy key on the server is restricted to a forced command
      # (see README/setup notes), so whatever is sent here is ignored by
      # sshd in favor of running /home/deploy/deploy-website.sh on the droplet.
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: deploy

      - name: Purge Cloudflare cache
        if: ${{ vars.CF_ZONE_ID != '' }}
        run: |
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CF_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
